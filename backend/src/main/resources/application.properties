spring.application.name=material-flow-rate-adjustment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.deserialization.ACCEPT_EMPTY_STRING_AS_NULL_OBJECT=true
logging.file.name=/app/logs/app.log
logging.logback.rolling.max-file-size=100MB
logging.logback.rolling.max-history=180
jwt.password=${JWT_PASSWORD}
jwt.period=${JWT_PERIOD}
admin.user=${ADMIN_USER}
admin.password=${ADMIN_PASSWORD}
front.base.api=${FRONT_BASE_API}
spring.jpa.hibernate.ddl-auto=validate